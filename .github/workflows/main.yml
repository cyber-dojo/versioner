name: Main

on:
  push:
    branches:
      - main

env:
  AWS_ECR_ID:          ${{ vars.AWS_ECR_ID }}
  AWS_REGION:          ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID_BETA: ${{ vars.AWS_ACCOUNT_ID_BETA }}


jobs:
  setup:
    runs-on: ubuntu-latest
    needs: []
    outputs:
      aws_account_id_beta:      ${{ steps.vars.outputs.aws_account_id_beta }}
      ecr_registry:             ${{ steps.vars.outputs.ecr_registry }}
      aws_region:               ${{ steps.vars.outputs.aws_region }}
      gh_actions_iam_role_name: ${{ steps.vars.outputs.gh_actions_iam_role_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare outputs for workflow jobs
        id: vars
        run: |
          echo "aws_account_id_beta=${AWS_ACCOUNT_ID_BETA}"   >> ${GITHUB_OUTPUT}          
          echo "ecr_registry=${ECR_REGISTRY}"                 >> ${GITHUB_OUTPUT}
          echo "aws_region=${AWS_REGION}"                     >> ${GITHUB_OUTPUT}
          echo "gh_actions_iam_role_name=gh_actions_services" >> ${GITHUB_OUTPUT}

  # Each platform's image is built and checked on a runner of that platform,
  # so nothing is emulated, and pushed as :<short-sha>-<arch>. publish then
  # names both in one multi-platform index.
  # service_image_tests checks the images app/.env names, not the image built
  # here, and runs in the amd64-only cyberdojo/docker-base, so it runs once,
  # in the amd64 job.
  build-amd64:
    runs-on: ubuntu-latest
    needs: [setup]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region:            ${{ needs.setup.outputs.aws_region }}
          role-duration-seconds: 900
          role-session-name:     ${{ github.event.repository.name }}
          role-to-assume:        arn:aws:iam::${{ needs.setup.outputs.aws_account_id_beta }}:role/${{ needs.setup.outputs.gh_actions_iam_role_name }}
          mask-aws-account-id:   false

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Test, build and push the amd64 image
        run: |
          make service_image_tests
          make build_image
          make push_platform_image arch=amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [setup]
    permissions:
      contents: read
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build and push the arm64 image
        run: |
          make build_image
          make push_platform_image arch=arm64

  publish:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - uses: docker/setup-buildx-action@v4

      # The release, if any, is read from the commit message.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Publish the multi-platform image
        run:
          make publish_image
